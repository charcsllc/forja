name: Feature request
description: Suggest an improvement to the builder
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home page and project gallery
        - Workspace chat and agent
        - Preview and visual editor
        - Code editor
        - Database panel
        - Publish, domains, GitHub, Figma
        - Docs
