name: Bug report
description: Something in the builder does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app
      placeholder: Home page, workspace chat, code editor, database panel, publish dialog…
  - type: textarea
    id: logs
    attributes:
      label: Console or terminal output
      render: shell
  - type: input
    id: version
    attributes:
      label: Node version and browser
      placeholder: Node 20.19, Chrome 140
