name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgres://app:app@localhost:5432/app
  DATABASE_URL_TEST: postgres://app:app@localhost:5432/app
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-00
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:migrator
      - name: Migrate (bundled migrator) and seed
        run: |
          node dist/migrate.mjs
          npm run db:seed
      - name: End-to-end smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
